<!doctype html><html lang='sr'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Partner Finder — Verifikacija licence</title>
<style>:root{--bg:#090e22;--panel:#171d43;--ivory:#f7f3ea;--gold:#d8b46a;--azure:#35b9e9;--muted:#aab1c9;--line:rgba(255,255,255,.1)}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 70% 15%,#242c63,#090e22 60%);color:var(--ivory);font-family:Inter,Arial,sans-serif;display:grid;place-items:center;padding:20px}.card{width:min(520px,100%);padding:30px;background:rgba(23,29,67,.9);border:1px solid var(--line);border-radius:20px;text-align:center}.brand{font-weight:900;letter-spacing:.1em}.brand span{color:var(--gold)}h1{font-size:24px;margin:22px 0 8px}.sub{color:var(--muted);font-size:13px;line-height:1.5}input{width:100%;padding:13px;margin-top:20px;border-radius:10px;border:1px solid var(--line);background:#0b1130;color:var(--ivory)}button{width:100%;margin-top:10px;padding:13px;border:0;border-radius:10px;background:var(--gold);font-weight:800;cursor:pointer}.result{margin-top:18px;padding:15px;border-radius:11px;border:1px solid var(--line);text-align:left;display:none}.ok{color:#65d6a0}.bad{color:#ff9a9a}.small{font-size:11px;color:var(--muted);margin-top:14px;line-height:1.5}</style></head>
<body><main class='card'><div class='brand'>PARTNER <span>FINDER</span></div><h1>Verifikacija licence</h1><div class='sub'>Provera autentičnosti komercijalne licence sistema.</div><input id='token' placeholder='Unesite verification token'><button id='verify'>VERIFIKUJ LICENCU</button><div id='result' class='result'></div><div class='small'>QR kod treba da vodi na ovu verifikacionu stranicu sa tokenom. Sam QR kod nije mehanizam zaštite; odluku donosi server.</div></main>
<script>const r=document.getElementById('result');const p=new URLSearchParams(location.search);document.getElementById('token').value=p.get('token')||'';document.getElementById('verify').onclick=async()=>{const token=document.getElementById('token').value.trim();if(!token){r.style.display='block';r.className='result bad';r.textContent='Unesite verification token.';return}r.style.display='block';r.className='result';r.textContent='Provera…';try{const res=await fetch('/api/license/verify?token='+encodeURIComponent(token));if(!res.ok)throw new Error();const d=await res.json();r.innerHTML=d.valid?'<strong class="ok">✓ LICENCA JE AKTIVNA</strong><br><br>Client ID: '+(d.clientId||'—')+'<br>Plan: '+(d.plan||'—')+'<br>Status: '+d.status:'<strong class="bad">✕ LICENCA NIJE AKTIVNA</strong><br><br>Status: '+d.status}catch(e){r.className='result bad';r.textContent='Verifikacioni servis trenutno nije dostupan.'}};</script></body></html>
