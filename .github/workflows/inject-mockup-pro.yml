name: Inject Mockup Pro Layer
on:
  push:
    paths:
      - 'marijana-mockup-studio/pro-enhancements.js'
      - 'marijana-mockup-studio/pro-enhancements.css'
      - '.github/workflows/inject-mockup-pro.yml'
permissions:
  contents: write
jobs:
  inject:
    if: ${{ !contains(github.event.head_commit.message, '[mockup-pro-injected]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Inject enhancement assets
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('marijana-mockup-studio/index.html')
          s=p.read_text()
          if 'pro-enhancements.js' not in s:
              s=s.replace('</body>','<script src="./pro-enhancements.js"></script></body>')
          p.write_text(s)
          p=Path('marijana-mockup-studio/styles.css')
          s=p.read_text()
          if 'pro-enhancements.css' not in s:
              s += '\n@import url("./pro-enhancements.css");\n'
          p.write_text(s)
          PY
      - name: Commit injected layer
        run: |
          git config user.name "Marijana Mockup Bot"
          git config user.email "actions@users.noreply.github.com"
          git add marijana-mockup-studio/index.html marijana-mockup-studio/styles.css
          git diff --cached --quiet && exit 0
          git commit -m "feat(mockup): inject Pro enhancement layer [mockup-pro-injected]"
          git push
